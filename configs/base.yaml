# bowlrl — base configuration (Phase 2: torque-driven bowler, PPO)
env:
  subject_height_m: 1.85        # template; set to the bowler's own height/mass
  subject_mass_kg: 85.0
  strength_scale: 1.0           # global peak-torque multiplier (dynamometry: see subject_example.yaml)
  control_hz: 100
  max_time: 0.60                # s; BFC -> release normally takes 0.25-0.35 s
  post_release_time: 0.10
  release_mode: policy          # policy | auto
  target_xy: [12.5, 0.10]       # good length, ~6.4 m short of the batter's stumps, off-stump line
  target_random_box: [1.0, 0.25]
  reference: auto               # auto -> data/reference/cem_reference.csv if present, else synthetic
  run_up_speed: 5.0
  init_noise_pos: 0.03
  init_noise_vel: 0.10
  obs_noise: 0.005
  action_noise: 0.02
  elbow_limit_deg: 15.0
  lumbar_comp_limit_bw: 8.0
  lumbar_shear_limit_bw: 2.5
  lumbar_penalty_cap: 4.0
  torque_velocity: true
  eccentric_gain: 1.3
  root_assist: 0.6              # curriculum: start with a virtual harness, anneal to 0
  root_assist_end: 0.0
  reward:
    speed: 10.0
    accuracy: 6.0
    track: 2.0
    track_end: 0.2
    effort: 0.02
    lumbar: 1.0
    upright: 0.1
    legal: 5.0
    full_toss: 3.0
    speed_norm: 40.0
    accuracy_sigma: 0.6
  aero:
    cd: 0.45
    cl_max: 0.28
    restitution: 0.35

train:
  algo: ppo
  total_timesteps: 20000000
  n_envs: 16
  n_steps: 256
  batch_size: 2048
  n_epochs: 6
  learning_rate: 0.0003
  lr_final: 0.00003
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0005
  vf_coef: 0.5
  max_grad_norm: 1.0
  net_arch: [256, 256]
  log_std_init: -1.0
  curriculum_start: 0.10        # fraction of training when annealing begins
  curriculum_end: 0.70          # fraction when tracking weight / assist reach their end values
  eval_freq: 50000              # env steps per env
  eval_episodes: 20
  checkpoint_freq: 250000
  seed: 0
  device: auto
