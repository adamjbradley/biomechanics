name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest (native, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: "Smoke: PD baseline bowls a legal delivery"
        run: python -m bowlrl.evaluate --baseline pd --episodes 2

  docker:
    name: docker build + tests in container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bowlrl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tests inside the image
        run: docker run --rm bowlrl:ci
      - name: Headless render check (EGL)
        run: |
          docker run --rm bowlrl:ci python3 -c "
          import numpy as np
          from bowlrl.envs.bowling_env import FastBowlingEnv, EnvConfig
          env = FastBowlingEnv(EnvConfig(seed=0), render_mode='rgb_array'); env.reset(seed=0)
          f = env.render(); assert f.shape == (480, 854, 3) and f.max() > 0; print('EGL render ok', f.shape)"
      - name: Compose config is valid
        run: docker compose config -q
